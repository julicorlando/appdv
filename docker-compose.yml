services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB in Coolify}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER in Coolify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in Coolify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY in Coolify}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Configure ALLOWED_HOSTS in Coolify}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Configure CSRF_TRUSTED_ORIGINS in Coolify}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      # Proxies confiáveis à frente do app (Traefik do Coolify = 1). Usado no limite de tentativas por IP.
      NUM_PROXIES: ${NUM_PROXIES:-1}
      # HTTPS é obrigatório por padrão; use False só se o proxy já redirecionar e estiver causando loop.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      # Envio de e-mail para "Esqueci minha senha" (opcional).
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      # PDV instalado: versão mínima aceita e link do instalador mais recente.
      PDV_VERSAO_MINIMA: ${PDV_VERSAO_MINIMA:-0.3.0}
      PDV_VERSAO_ATUAL: ${PDV_VERSAO_ATUAL:-0.3.2}
      PDV_OFFLINE_DIAS: ${PDV_OFFLINE_DIAS:-30}
      PDV_DOWNLOAD_URL: ${PDV_DOWNLOAD_URL:-https://github.com/julicorlando/appdv/releases/latest}
      BACKUP_MANTER: ${BACKUP_MANTER:-14}
    expose:
      - "8000"
    volumes:
      - app_media:/app/media
      - app_backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_media:
  app_backups:
