{% extends "base.html" %}{% block content %}<h1>Equipe e permissões</h1><section class="panel"><h2>Novo usuário</h2><form method="post">{% csrf_token %}<label>Usuário<input name="username" maxlength="150" required></label><label>E-mail<input name="email" type="email"></label><label>Senha inicial<input name="senha" type="password" minlength="10" autocomplete="new-password" required></label><label>Perfil<select name="papel"><option value="CAIXA">Caixa</option><option value="GERENTE">Gerente</option><option value="ADMIN">Administrador</option></select></label><button>Criar usuário nesta empresa</button></form></section>{% for t in membros %}<section class="panel"><form method="post">{% csrf_token %}<input type="hidden" name="membro" value="{{ t.pk }}"><h2>{{ t.usuario.username }}</h2><label>Perfil<select name="papel"><option value="{{ t.papel }}">{{ t.get_papel_display }}</option><option value="CAIXA">Caixa</option><option value="GERENTE">Gerente</option><option value="ADMIN">Administrador</option></select></label><label><input name="ativo" type="checkbox" {% if t.ativo %}checked{% endif %}>Acesso ativo</label><button>Salvar permissões</button></form><form method="post" action="{% url 'gestao-equipe-senha' empresa.id %}" class="inline-form">{% csrf_token %}<input type="hidden" name="membro" value="{{ t.pk }}"><input name="nova_senha" type="password" minlength="10" autocomplete="new-password" placeholder="Nova senha provisória" required><button class="secondary">Redefinir senha</button></form></section>{% endfor %}{% endblock %}
