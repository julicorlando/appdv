name: Testes

on:
  push:
  pull_request:

# Publicações em sequência no mesmo branch cancelam a execução anterior.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrações completas
        run: python manage.py makemigrations --check --dry-run
        env:
          DEBUG: "True"
      - name: Arquivos estáticos (os templates usam o manifesto)
        run: python manage.py collectstatic --noinput
      - name: Testes do backend
        run: python manage.py test core -v 2

  pdv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pdv/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2t64
      - run: pip install -r requirements.txt
      - name: Testes do PDV
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
